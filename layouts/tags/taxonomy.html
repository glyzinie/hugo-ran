{{ define "main" }}
{{ partial "content/breadcrumbs.html" . }}
<article class="page">
	<h1>{{ .Title }}</h1>
	{{ with .Content }}<div class="entry">{{ . }}</div>{{ end }}
	<div class="tags">
		<ul class="label">
			{{ range .Data.Terms.Alphabetical }}
			<li>
				<a href="{{ .Page.RelPermalink }}">
					<span>{{ .Page.LinkTitle }}</span>
					<span class="count">{{ .Count }}</span>
				</a>
			</li>
			{{ end }}
		</ul>
	</div>
</article>
{{ end }}
