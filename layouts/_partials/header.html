{{- $isAMP := .isAMP -}}
{{- with .page -}}
	<header class="masthead clearfix">
		<div class="container">
			{{ with .Site.Params.Logo }}
			<a href="{{ $.page.Site.BaseURL }}" class="site-avatar"{{ if not $isAMP }} alt="Logo"{{ end }}>
				{{ if $isAMP }}<amp-img src="{{ . }}" width="70" height="70" layout="responsive" alt="Logo"></amp-img>{{ else }}<img src="{{ . }}">{{ end }}
			</a>
			{{ end }}

			<div class="site-info">
				<h1 class="site-name">
					<a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
				</h1>
				{{ with .Site.Params.Description }}
				<p class="site-description">{{ . }}</p>
				{{ end }}
			</div>

			{{ with .Site.Menus.main }}
			<nav>
				{{ range .ByWeight }}
				<a href="{{ .URL }}">{{ .Name }}</a>
				{{ end }}
			</nav>
			{{ end }}
		</div>
	</header>
{{- end -}}
