{{- $description := partial "templates/description.html" . -}}
	<link rel="icon" href="{{ partial "templates/favicon.html" . }}">
	<meta name="description" content="{{ $description }}">
	<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
	<meta property="og:title" content="{{ partial "templates/title.html" . }}">
	<meta property="og:description" content="{{ $description }}">
	<meta property="og:url" content="{{ .Permalink }}">
	<meta property="og:image" content="{{ partial "templates/thumb.html" . }}">
	<meta name="twitter:card" content="summary_large_image">
	{{ with .Site.Params.Author.Twitter }}
	<meta name="twitter:site" content="@{{ . }}">
	{{ end }}
