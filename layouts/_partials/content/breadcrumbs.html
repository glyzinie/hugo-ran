{{- $items := partial "templates/breadcrumbs.html" . -}}
{{- if gt (len $items) 1 -}}
<nav class="breadcrumbs" aria-label="{{ i18n "breadcrumbs" }}">
	<ol>
		{{- $last := sub (len $items) 1 -}}
		{{- range $index, $item := $items }}
		<li>
			{{- if eq $index $last -}}
			<span aria-current="page">{{ $item.name }}</span>
			{{- else -}}
			<a href="{{ $item.url }}">{{ $item.name }}</a>
			{{- end -}}
		</li>
		{{- end }}
	</ol>
</nav>
{{- end -}}
